name: Android Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 9.3.1

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Ensure debug keystore exists
      run: |
        if [ ! -f debug.keystore ]; then
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
        fi

    - name: Fix Headless KSP Environment
      run: |
        # KSP has a known bug in headless environments when running in-process, causing an AWT EventQueue NullPointerException.
        # This removes the in-process execution strategy if it exists, allowing KSP to spawn properly.
        sed -i 's/kotlin.compiler.execution.strategy=in-process/# kotlin.compiler.execution.strategy=in-process/g' gradle.properties || true

    - name: Build APKs with R8 Compression
      run: ./gradlew assembleRelease assembleDebug --no-daemon
      env:
        STORE_PASSWORD: android
        KEY_ALIAS: androiddebugkey
        KEY_PASSWORD: android

    - name: Rename APKs
      run: |
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/AetherWeb-release.apk || true
        mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/AetherWeb-release-unsigned.apk || true
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AetherWeb-debug.apk || true

    - name: Upload Built APKs
      uses: actions/upload-artifact@v4
      with:
        name: AetherWeb-Distribution-Build
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download built APKs
      uses: actions/download-artifact@v4
      with:
        name: AetherWeb-Distribution-Build
        path: apks

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: apks/**/*.apk
        fail_on_unmatched_files: true
        generate_release_notes: true

